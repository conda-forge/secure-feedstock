schema_version: 1

context:
  name: secure
  version: "2.0.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/secure-${{ version }}.tar.gz
  sha256: d6f242bfd9e56a7b279aed0554b80f1b1558559e20ec707cc71dc50de9835a50

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - wheel >=0.48.0
    - setuptools >=84.2.1
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - secure
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A lightweight package that adds security headers for Python web frameworks.
  license: MIT
  license_file:
    - LICENSE
  homepage: https://github.com/TypeError/secure
  documentation: https://secure.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - thewchan
